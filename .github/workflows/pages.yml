name: Publish seismic explorer

# Publication is deliberate: a push alone does not redeploy this research site.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seismic-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the authorized source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify and restore the frozen public ComCat responses
        run: python scripts/prepare_public_evidence.py restore
      - name: Run scientific contract checks
        run: python -m unittest discover -s tests
      - name: Verify catalogue registry and packaged source hashes
        run: python scripts/build_catalogs.py --verify-only
      - name: Verify country index against the pinned catalogue rows and map polygons
        run: python scripts/build_country_index.py --verify-only
      - name: Verify full-download SSN diagnostic summary
        run: python scripts/build_diagnostic_coverage.py --verify-only
      - name: Check shared views, filters and bilingual labels
        run: |
          node tests/test_view_state.cjs
          node tests/test_system_labels.cjs
          node tests/test_catalog_frontend.cjs
          node tests/test_catalog_composition.cjs
          node tests/test_analytics.cjs
          node tests/test_research_charts.cjs
          node tests/test_preferences.cjs
          node tests/test_map_basemaps.cjs
      - name: Reproduce the independent retained-product validation
        run: python -m scripts.validate_evidence
      - name: Check static references, privacy and pinned asset bytes
        run: python scripts/check_links.py --scope artifact
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload only the public explorer
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: system/dist

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated explorer
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
