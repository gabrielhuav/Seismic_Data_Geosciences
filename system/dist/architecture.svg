<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 820" role="img" aria-labelledby="title desc"><title id="title">Implemented system architecture</title><desc id="desc">Preserved sources, verified adapters and browser computations, reusable outputs, and a separate offline evidence audit.</desc><rect width="1700" height="820" fill="white"/><g font-family="Arial,Helvetica,sans-serif" fill="#183342"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#506573"/></marker></defs><text x="30" y="44" font-size="21" font-weight="700" text-anchor="start">01</text><text x="77" y="44" font-size="26" font-weight="700" text-anchor="start">PRESERVED SOURCES</text><text x="600" y="44" font-size="21" font-weight="700" text-anchor="start">02</text><text x="647" y="44" font-size="26" font-weight="700" text-anchor="start">ADAPTATION AND COMPUTATION</text><text x="1170" y="44" font-size="21" font-weight="700" text-anchor="start">03</text><text x="1217" y="44" font-size="26" font-weight="700" text-anchor="start">WORKSPACE AND DELIVERABLES</text><rect x="30" y="79" width="490" height="117" rx="8" fill="#f6f8fa" stroke="#91a2ac" stroke-width="1.5"/><g transform="translate(66 128)" fill="none" stroke="#215b91" stroke-width="2"><circle r="24"/><ellipse rx="10" ry="24"/><path d="M-23 0H23M-19 -12H19M-19 12H19"/><path d="M10 -25Q27 -47 35 -27Q38 -16 22 -8Q9 -17 10 -25Z" fill="white"/><circle cx="23" cy="-27" r="4"/></g><text x="108" y="109" font-size="29" font-weight="700" text-anchor="start">USGS · Mexico region</text><text x="108" y="140" font-size="29" font-weight="400" text-anchor="start">24,994 source rows</text><text x="108" y="169" font-size="24" font-weight="400" text-anchor="start">1900–2026 · regional snapshot</text><rect x="30" y="214" width="490" height="117" rx="8" fill="#f6f8fa" stroke="#91a2ac" stroke-width="1.5"/><g transform="translate(66 263)" fill="none" stroke="#215b91" stroke-width="2"><circle r="24"/><ellipse rx="10" ry="24"/><path d="M-23 0H23M-19 -12H19M-19 12H19"/><path d="M10 -25Q27 -47 35 -27Q38 -16 22 -8Q9 -17 10 -25Z" fill="white"/><circle cx="23" cy="-27" r="4"/></g><text x="108" y="244" font-size="29" font-weight="700" text-anchor="start">USGS · North America</text><text x="108" y="275" font-size="29" font-weight="400" text-anchor="start">14,041 source rows</text><text x="108" y="304" font-size="24" font-weight="400" text-anchor="start">2020–2025 · regional windows</text><rect x="30" y="349" width="490" height="117" rx="8" fill="#f6f8fa" stroke="#91a2ac" stroke-width="1.5"/><g transform="translate(66 398)" fill="none" stroke="#215b91" stroke-width="2"><circle r="24"/><ellipse rx="10" ry="24"/><path d="M-23 0H23M-19 -12H19M-19 12H19"/><path d="M10 -25Q27 -47 35 -27Q38 -16 22 -8Q9 -17 10 -25Z" fill="white"/><circle cx="23" cy="-27" r="4"/></g><text x="108" y="379" font-size="29" font-weight="700" text-anchor="start">NRCan / GSC · Canada</text><text x="108" y="410" font-size="29" font-weight="400" text-anchor="start">6,613 source rows</text><text x="108" y="439" font-size="24" font-weight="400" text-anchor="start">1985–2019 · historical download</text><rect x="30" y="484" width="490" height="117" rx="8" fill="#f6f8fa" stroke="#91a2ac" stroke-width="1.5"/><g transform="translate(66 533)" fill="none" stroke="#215b91" stroke-width="2"><circle r="24"/><ellipse rx="10" ry="24"/><path d="M-23 0H23M-19 -12H19M-19 12H19"/><path d="M10 -25Q27 -47 35 -27Q38 -16 22 -8Q9 -17 10 -25Z" fill="white"/><circle cx="23" cy="-27" r="4"/></g><text x="108" y="514" font-size="29" font-weight="700" text-anchor="start">SSN / UNAM · Mexico</text><text x="108" y="545" font-size="29" font-weight="400" text-anchor="start">242,288 source rows</text><text x="108" y="574" font-size="24" font-weight="400" text-anchor="start">1900–2026 · partial final year</text><path d="M531 320L582 320" stroke="#506573" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="600" y="79" width="490" height="156" rx="8" fill="#eef3f8" stroke="#91a2ac" stroke-width="1.5"/><text x="627" y="115" font-size="30" font-weight="700" text-anchor="start">Python source adapters</text><text x="627" y="151" font-size="28" font-weight="400" text-anchor="start">CSV / GeoJSON → query schema</text><text x="627" y="181" font-size="28" font-weight="400" text-anchor="start">UTC · types · documented units</text><text x="627" y="211" font-size="28" font-weight="400" text-anchor="start">Original values and nulls retained</text><path d="M845 240L845 275" stroke="#506573" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="600" y="286" width="490" height="125" rx="8" fill="#f6f8fa" stroke="#91a2ac" stroke-width="1.5"/><text x="627" y="324" font-size="30" font-weight="700" text-anchor="start">SHA-256 verification</text><text x="627" y="360" font-size="28" font-weight="400" text-anchor="start">JSON + manifests · Web Crypto</text><text x="627" y="391" font-size="28" font-weight="400" text-anchor="start">Git / Actions / static Pages</text><path d="M845 416L845 448" stroke="#506573" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="600" y="460" width="490" height="142" rx="8" fill="#eef3f8" stroke="#91a2ac" stroke-width="1.5"/><text x="627" y="498" font-size="30" font-weight="700" text-anchor="start">Browser JavaScript</text><text x="627" y="533" font-size="28" font-weight="400" text-anchor="start">Filter · group · compute · draw</text><text x="627" y="567" font-size="28" font-weight="400" text-anchor="start">Session memory · no server DB</text><path d="M1100 320L1152 320" stroke="#506573" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1170" y="79" width="490" height="523" rx="8" fill="#f6f8fa" stroke="#91a2ac" stroke-width="1.5"/><rect x="1195" y="109" width="440" height="215" rx="8" fill="#fff" stroke="#91a2ac" stroke-width="1.5"/><path d="M1195 143L1635 143" stroke="#506573" stroke-width="2" fill="none"/><text x="1213" y="133" font-size="26" font-weight="700" text-anchor="start">HTML / CSS / JS · Leaflet</text><circle cx="1230" cy="191" r="6" fill="#215b91"/><circle cx="1260" cy="222" r="6" fill="#215b91"/><circle cx="1302" cy="198" r="6" fill="#215b91"/><circle cx="1340" cy="261" r="6" fill="#215b91"/><path d="M1215 277L1370 161" stroke="#506573" stroke-width="2" fill="none"/><path d="M1410 281L1610 281" stroke="#506573" stroke-width="2" fill="none"/><path d="M1410 281L1410 167" stroke="#506573" stroke-width="2" fill="none"/><circle cx="1433" cy="258" r="5" fill="#aa551b"/><circle cx="1470" cy="237" r="5" fill="#aa551b"/><circle cx="1517" cy="245" r="5" fill="#aa551b"/><circle cx="1570" cy="197" r="5" fill="#aa551b"/><text x="1195" y="362" font-size="30" font-weight="700" text-anchor="start">Maps and source records</text><text x="1195" y="405" font-size="28" font-weight="400" text-anchor="start">Grouped statistics / SVG</text><text x="1195" y="441" font-size="28" font-weight="400" text-anchor="start">Version diagnostics / lineage</text><text x="1195" y="477" font-size="28" font-weight="400" text-anchor="start">Full-download SSN coverage</text><text x="1195" y="513" font-size="28" font-weight="400" text-anchor="start">CSV / JSON / HTML / ZIP</text><text x="1195" y="549" font-size="28" font-weight="400" text-anchor="start">Input and payload hashes</text><rect x="30" y="657" width="1630" height="132" rx="8" fill="#f5f5f5" stroke="#91a2ac" stroke-width="1.5"/><text x="56" y="697" font-size="30" font-weight="700" text-anchor="start">SEPARATE OFFLINE EVIDENCE AUDIT</text><text x="56" y="735" font-size="29" font-weight="400" text-anchor="start">ComCat products → Python contracts → SQLite oracle and synthetic fixtures</text><text x="56" y="768" font-size="27" font-weight="400" text-anchor="start">Separate from the web runtime. Source rows are not merged into independent earthquakes; no forecast.</text></g></svg>
